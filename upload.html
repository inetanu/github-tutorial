<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>HTML 5 complete</title>
  [if IE]
<script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>

  ![endif]
  <style>
    article,
    /* article は  HTML のタグで文書、ページ、アプリケーション、またはサイトの中で完全もしくは自己完結した構造を表す。*/
    aside,
    /* asideはHTMLのタグでaside要素の周囲のコンテンツに付随的に関連するコンテンツから構成され、かつそのコンテンツとは別のものと見なすことができるページのセクションを表す。*/
    dialog,
    /* モーダルまたは非モーダルダイアログボックスや、それ以外の消すことができるアラート、インスペクター、サブウィンドウなどのような対話的コンポーネントを表す */
    figure,
    footer,
    header,
    hgroup,
    menu,
    nav,
    section {
      display: block;
    }
  </style>
</head>

<body>
  <p>Hello World</p>
</body>

</html>
